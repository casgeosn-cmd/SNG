<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak Number Guessing Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Simple Games</h1>
    </header>
    <div class="split left">
        <div class="centered">
        <img src="img/mic2.png" alt="Microphone to speak into"/>
        <h2>Speak Number Guessing Game</h2>
        <h3> Guess a Number Between 1 - 100</h3>
        <p> Speak the number into your microphone</p>
        <div id="msg" class="msg"></div>
        </div>
    <div class="split right">
        <div class="centered">
            <h2>Dad Jokes</h2>
            <div class="container"></div>
            <div id="joke" class = "joke">Joke goes here</div>
            <button id="jokeBtn" class="jokeBtn">Get Another Joke</button>
  <!-- div for container -->
        </div> 
        <!-- div for centered -->
    </div>
    <!-- div for split right -->
</div>

</body>
</html>
